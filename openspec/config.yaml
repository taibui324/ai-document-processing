schema: spec-driven

context: |
  MediConCen Senior Application Architect take-home assessment.
  Authoritative input: Application Architect Technical Assessment.pdf, all six pages.
  Required stack: NestJS, Node.js/TypeScript, MySQL 8, Redis where appropriate,
  Google Gemini, Docker/Compose. Target implementation effort: 6-8 hours.
  Build a small backend: asynchronous document ingestion, validated AI extraction,
  resilient vendor submission, durable status, duplicate protection, deterministic
  failure simulations, migrations, API docs, diagrams, and design rationale.
  No frontend or full insurance product. Use synthetic documents for demonstrations.
  Current workspace initially contains assessment documents only; no application exists.

rules:
  proposal:
    - Distinguish assessment requirements from chosen implementation defaults.
  specs:
    - Make failure handling, restart recovery, and duplicate protection testable.
  design:
    - Map assessment sections to implementation decisions and acceptance evidence.
    - Explain added libraries and the limits of the production-oriented demonstration.
  tasks:
    - Order work into time-boxed increments with concrete outputs and verification.
    - Keep implementation tasks unchecked until implemented and verified.

